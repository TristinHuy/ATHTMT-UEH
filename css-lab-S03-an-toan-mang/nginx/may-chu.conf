# Cấu hình khởi điểm của máy chủ. Nó chạy được, và nó sai.
#
# Sai ở chỗ nào thì `make attack` cho bạn thấy trong mười giây: nội dung đi ra
# dưới dạng bản rõ, nên mọi tiến trình khác trong cùng mạng đọc được. Đây đúng là
# thứ §3.3 của giáo trình gọi là chặng cuối, mã CWE-319, và lý do người ta để yên
# thường là câu "phía trong là mạng nội bộ".
#
# Việc của bạn là thay khối dưới đây bằng một khối phục vụ trên TLS, rồi bật tiếp
# xác thực hai chiều. Đừng giữ lại khối cũ cho tiện thử: một cổng phẳng còn sống
# thì hai lớp phòng thủ bên trên chỉ còn là trang trí.

server {
    listen 8443 ssl; #đã từng là 8080
    server_name may-chu;

    ssl_protocols TLSv1.3;
    ssl_certificate /pki/may-chu/may-chu.crt; #đường dẫn tới chứng chỉ máy chủ
    ssl_certificate_key /pki/may-chu/may-chu.key;

        ssl_client_certificate /pki/ca/ca.crt; #bước thứ 5 Bật xác thực hai chiều, tức là buộc phía khách cũng phải trình chứng thư
    ssl_verify_client on;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
