# Bảng năm sự kiện. Đây là hiện vật được chấm nặng nhất của bài.
#
# Chép tệp này thành docs/bang-nam-su-kien.yaml rồi điền. Giữ nguyên tên trường.
#
# Luật của bài: mỗi sự kiện tìm lại bằng ĐÚNG MỘT câu truy vấn, và không được mở
# lịch sử dòng lệnh để nhớ mình đã làm gì. Ràng buộc thứ hai nghe như mẹo chống
# gian lận nhưng không phải. Nó mô phỏng ATT&CK T1070.003: lịch sử dòng lệnh là
# thứ biến mất đầu tiên trên một máy đã bị chiếm, nên người vận hành không được
# phép coi nó là nguồn. Nếu bạn chỉ trả lời được nhờ nhớ lại mình đã gõ gì thì
# nhật ký của bạn chưa trả lời được, và đó là phát hiện chứ không phải thất bại.
#
# Bắt buộc có ít nhất MỘT dòng tim_duoc: false. Dòng không tìm được dạy nhiều
# nhất, vì nó chỉ ra một chỗ hệ thống im lặng. Giấu nó đi là tự bỏ phần điểm cao
# nhất, và thang chấm nói rõ điều đó.

# Nguồn dữ liệu. Nhận hai giá trị: cua_minh, thay_the.
# Dùng bộ dữ liệu thay thế do giảng viên phát không bị trừ điểm kiến thức, nhưng
# phải khai và phải nói vì sao, vì người chấm cần biết bảng này nói về hệ thống
# của bạn hay về hệ thống của người khác.
nguon_du_lieu: cua_minh
ly_do_dung_du_lieu_thay_the: null

su_kien:

  - buoi: S02
    ten: Mot tien trinh gianh them quyen qua tep setuid
    mo_ta_su_kien: >-
      Mô tả điều đã xảy ra ở buổi hai, bằng câu của bạn, đủ để người chấm biết
      bạn đang tìm lại đúng thứ gì. Ít nhất mười hai từ.
    truy_van: '{job="nhat-ky-lab", buoi="S02"} | json | ...'
    tim_duoc: true
    so_dong_khop: 0
    ma_attack: T1685.004
    ma_cwe: CWE-778
    ly_do_khong_tim_duoc: null
    ghi_chu: >-
      Chỗ để nói điều bạn học được khi tìm. Trường nào thiếu, nhãn nào đặt sai,
      câu truy vấn đầu tiên hỏng ở đâu.

  - buoi: S03
    ten: Mot lan noi bi tu choi vi thieu chung thu khach
    mo_ta_su_kien: >-
      Điền.
    truy_van: '{job="nhat-ky-lab", buoi="S03"} | json | ...'
    tim_duoc: true
    so_dong_khop: 0
    ma_attack: T1685
    ma_cwe: CWE-778
    ly_do_khong_tim_duoc: null
    ghi_chu: >-
      Điền.

  - buoi: S04
