    truy_van: '{job="nhat-ky-lab", buoi="S04"} | json | ...'
    tim_duoc: true
    so_dong_khop: 0
    ma_attack: T1685
    ma_cwe: CWE-532
    ly_do_khong_tim_duoc: null
    ghi_chu: >-
      Điền.

  - buoi: S05
    ten: Mot tam the qua han
    mo_ta_su_kien: >-
      Điền.
    truy_van: '{job="nhat-ky-lab", buoi="S05"} | json | ...'
    tim_duoc: true
    so_dong_khop: 0
    ma_attack: T1685
    ma_cwe: CWE-778
    ly_do_khong_tim_duoc: null
