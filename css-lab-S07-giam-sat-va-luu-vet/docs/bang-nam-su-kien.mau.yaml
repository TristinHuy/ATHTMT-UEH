      Điền.

  - buoi: S06
    ten: Mot yeu cau web bi chinh sach noi dung chan
    mo_ta_su_kien: >-
      Điền.
    truy_van: '{job="nhat-ky-lab", buoi="S06"} | json | ...'
    # Ít nhất một trong năm dòng phải để false, kèm lý do và kèm ghi chú giải
    # thích. Ba lý do được nhận, và chúng khác nhau về bản chất:
    #   khong_he_ghi         nguồn ấy không sinh ra dòng nào cho việc này
    #   thieu_truong_de_loc  có ghi, nhưng thiếu trường nên không lọc ra được
    #   het_han_giu          đã từng ghi, nhưng hạn giữ đã cắt mất
    tim_duoc: false
    so_dong_khop: 0
    ma_attack: T1685
    ma_cwe: CWE-778
    ly_do_khong_tim_duoc: thieu_truong_de_loc
    ghi_chu: >-
      Nói rõ bạn đã thử câu truy vấn nào, và vì sao bạn kết luận là thiếu trường
      chứ không phải là không hề ghi. Hai chuyện ấy chữa bằng hai cách khác nhau.
