# Số đo của bài lab S2. Bạn điền tệp này, bộ chấm đọc tệp này.
#
# Mỗi con số ở đây phải có một tệp trong evidence/S02/ đỡ lưng. Bộ kiểm đối chiếu
# số bạn khai với nội dung tệp bằng chứng, nên một con số đẹp mà không có tệp
# tương ứng thì bị bắt, và bị bắt là đúng: bài này đo cấu hình thật chứ không đo
# lời khai.

# --- Năng lực của tiến trình dịch vụ ---
# Đếm số năng lực trên dòng "Current:" của evidence/S02/capsh-truoc.txt và
# capsh-sau.txt. Tập rỗng thì ghi 0.
nang_luc_truoc: 14     # số nguyên
nang_luc_sau: 0       # số nguyên

# --- Chỉ số làm cứng của Lynis ---
# Lấy dòng "Hardening index" trong evidence/S02/lynis-truoc.txt và lynis-sau.txt.
lynis_truoc: 57        # số nguyên từ 0 tới 100
lynis_sau: 57          # số nguyên từ 0 tới 100

# Giải thích chênh lệch, tối thiểu 20 từ. Câu trả lời "chỉ số tăng vì em đã làm
# cứng" không đạt. Nói rõ Lynis nhìn thấy thay đổi nào của bạn, và quan trọng hơn,
# thay đổi nào của bạn nó KHÔNG nhìn thấy. Chỉ số không nhúc nhích cũng là một kết
# quả hợp lệ nếu bạn giải thích được vì sao.
lynis_giai_thich: "Điểm số Lynis không thay đổi vì Lynis chạy bên trong container và chỉ quét cấu hình cấp độ hệ điều hành (Debian). Các biện pháp làm cứng trọng yếu như read_only (khóa hệ tệp gốc), cap_drop (tước đặc quyền Linux) và no-new-privileges được Docker áp đặt từ lớp vỏ bên ngoài (host). Do đó, Lynis không nhìn xuyên qua được lớp vỏ này để cộng điểm."

# --- Thí nghiệm stack protector ---
# Hai mã thoát trong evidence/S02/stack-protector.txt.
ma_thoat_khong_bao_ve: 139  # số nguyên
ma_thoat_co_bao_ve: 134     # số nguyên

# --- Cổng dịch vụ nghe sau khi làm cứng ---
# Ghi đúng cổng trong container, tức giá trị khóa cong của tệp cấu hình sau khi
# bạn sửa. Giữ cổng 80 cũng được, đổi sang cổng không đặc quyền cũng được, miễn
# là bạn nói được vì sao ở dòng dưới.
cong_sau: 80
vi_sao_chon_cong_do: "Em giữ nguyên cổng đặc quyền 80 vì đã cấu hình tước toàn bộ đặc quyền (cap_drop: ALL) nhưng cấp lại đúng một năng lực mạng duy nhất là NET_BIND_SERVICE. Phương pháp này tuân thủ nguyên tắc đặc quyền tối thiểu."
