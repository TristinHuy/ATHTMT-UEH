# Tệp cấu hình máy chủ. Bạn sửa tệp này ở bước bật lưu vết.
#
# Máy chủ khởi động với đúng tệp này, nên một dòng sai cú pháp ở đây làm container
# không lên được. Khi đó `docker compose logs csdl` nói dòng nào, và đó cũng là
# cách đọc lỗi bạn sẽ dùng cả buổi.

listen_addresses = '*'

# Ghi nhật ký ra đầu ra chuẩn của container, để `docker compose logs` đọc được.
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '

# --------------------------------------------------------------------------
# PHẦN BẠN PHẢI VIẾT.
#
# pgaudit là một phần mở rộng nạp lúc máy chủ khởi động, nên nó phải có tên
# trong shared_preload_libraries; nạp muộn hơn thì không kịp thấy câu truy vấn
# nào. Đó là lý do bước này đòi khởi động lại máy chủ chứ không chỉ nạp lại cấu
# hình.
#
# Hai lựa chọn, và đề bài đòi lựa chọn thứ hai.
#
#   pgaudit.log = 'all'    ghi mọi câu của mọi phiên. Nghe an toàn, và đó là
#                          lý do nó nguy hiểm: khối lượng nhật ký lớn tới mức
#                          nhật ký sẽ bị tắt vào ngày có người nhìn hóa đơn lưu
#                          trữ, đúng chỗ §4.4 cảnh báo.
#
#   pgaudit.role = '<vai trò đánh dấu>'
#                          ghi ở MỨC ĐỐI TƯỢNG: chỉ những đối tượng mà vai trò
#                          đánh dấu được cấp quyền mới bị ghi. Bạn chọn cái gì
#                          đáng ghi, và bạn trả lời được vì sao.
#
# Viết hai dòng cần thiết vào dưới đây. Bộ kiểm đọc chính tệp này.
shared_preload_libraries = 'pgaudit'
pgaudit.role = 'kiem_toan'
